name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

# A new push to the same branch supersedes the run already in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, Type-check & Build
    runs-on: ubuntu-latest

    env:
      # No database is reached in CI. `lib/prisma.ts` throws at import time when
      # DATABASE_URL is unset, and `next build` imports it while collecting page
      # data, so a well-formed placeholder is all that is needed. The adapter
      # does not open a connection until a query runs.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      LIVEBLOCKS_SECRET_KEY: ${{ vars.LIVEBLOCKS_SECRET_KEY }}
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No `version` here on purpose: the action reads package.json#packageManager,
      # which keeps CI on the same pnpm as local and Vercel.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # pnpm 11.1.2 loads `node:sqlite`, so it needs Node >= 22.13. Keep this in
      # step with package.json#engines.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The generated client is gitignored, so it does not exist on a fresh
      # checkout. `pnpm build` generates it too, but build runs last — lint and
      # typecheck resolve `@/app/generated/prisma/client` and need it first.
      - name: Generate Prisma client
        run: pnpm exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

  deploy-trigger:
    name: Deploy Trigger.dev tasks
    # Only a merge into main ships tasks. Pull requests stop at the `ci` job so a
    # branch never overwrites the prod deployment.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest

    env:
      # `trigger deploy` authenticates with a Personal Access Token (tr_pat_...),
      # NOT the TRIGGER_SECRET_KEY the app uses at runtime. Generate one at
      # https://cloud.trigger.dev/account/tokens and store it as a repo secret.
      TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # No `prisma generate` here: nothing under `src/trigger` imports the Prisma
      # client, so the deploy bundle never resolves `@/app/generated/prisma`.
      # Secrets the tasks need at runtime (GOOGLE_GENERATIVE_AI_API_KEY,
      # LIVEBLOCKS_SECRET_KEY) are set in the Trigger.dev dashboard, not here.
      - name: Deploy tasks
        run: pnpm exec trigger deploy
